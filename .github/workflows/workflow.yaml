name: HandlebarsABAP workflow

on:
  release:
    types:
      - created
  push:
  pull_request:

permissions:
  contents: write

env:
  ABAPGIT_CLASS_FILE: src/zcl_handlebars_abap.clas.abap
  RELEASE_CLASS_FILE: ZCL_HANDLEBARS_ABAP.abap

jobs:
  lint:
    name: Lint source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: abaplint
        uses: abaplint/actions-abaplint@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create release file
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          sed 's/{{version}}/${{ github.event.release.tag_name }}/g' ${ABAPGIT_CLASS_FILE} > ${RELEASE_CLASS_FILE}

      - name: Upload
        run: |
          gh release upload ${{ github.event.release.tag_name }} ${RELEASE_CLASS_FILE}
        env:
            GH_TOKEN: ${{ github.TOKEN }}
